name: UBC CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Unit, negative and build checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --offline || npm ci --ignore-scripts
      - run: npm run check
      - name: Configured production build
        env:
          UBC_ENGINE_ORIGIN: https://live-debate-engine.onrender.com
        run: npm run build && grep -q "connect-src https://live-debate-engine.onrender.com;" dist/index.html
