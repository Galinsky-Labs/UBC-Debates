# UBC Debates static site (free). Build-time configuration is non-secret: the engine origin and
# the UBC tenant id in the engine (set UBC_TENANT_ID once the owner creates the tenant).
services:
  - type: web
    runtime: static
    name: ubc-debates
    branch: main
    autoDeploy: true
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    envVars:
      - key: UBC_ENGINE_ORIGIN
        value: https://live-debate-engine.onrender.com
      - key: UBC_TENANT_ID
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://live-debate-engine.onrender.com; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
